<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Data Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    header {
      text-align: center;
      padding: 20px;
      background: #0f2b48;
      color: white;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    h1 {
      margin: 0 0 10px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      border-left: 5px solid #ff9933;
    }
    .card h3 {
      margin-top: 0;
      color: #1a1a1a;
    }
    .badge {
      display: inline-block;
      background: #eef2f7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 12px;
    }
    .detail {
      font-size: 0.9rem;
      margin: 6px 0;
      line-height: 1.4;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bharat Data Project</h1>
    <p>Prime Ministers of India (1947 – Present)</p>
  </header>

  <div id="pm-container" class="grid">
    <p>Loading records...</p>
  </div>

  <script>
    fetch('prime_ministers.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('pm-container');
        container.innerHTML = '';

        data.forEach(pm => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>#${pm.id} ${pm.name}</h3>
            <div class="badge">${pm.party}</div>
            <div class="detail"><span class="label">Term:</span> ${pm.term_start} &ndash; ${pm.term_end}</div>
            <div class="detail"><span class="label">Seats Won:</span> ${pm.seats_won}</div>
            <div class="detail"><span class="label">Total Lok Sabha Seats:</span> ${pm.total_seats}</div>
            <div class="detail"><span class="label">Vote Share:</span> ${pm.vote_share}</div>
          `;
          container.appendChild(card);
        });
      })
      .catch(error => {
        document.getElementById('pm-container').innerHTML = '<p>Error loading data.</p>';
        console.error(error);
      });
  </script>

</body>
</html>
