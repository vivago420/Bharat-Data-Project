<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Data Project</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #000;
    }

   /* Fixed Waving Indian Flag Background */
    #bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Updated to a reliable, high-quality Unsplash image */
      background: url('INDflag.png') no-repeat center center;
      background-size: cover;
      opacity: 0.99; /* 99% initial visibility */
      transition: opacity 0.8s ease-in-out;
      z-index: -1;
    }

    #bg-image.dimmed {
      opacity: 0.25; /* 25% visibility after clicking a button */
    }

    .content-wrapper {
      position: relative;
      padding: 20px;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 20px;
      background: rgba(15, 43, 72, 0.85);
      color: white;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    h1 { margin: 0 0 10px 0; }
    
    /* Navigation Buttons with Hover and Lower Shadow Effect */
    .nav-tabs {
      text-align: center;
      margin-bottom: 30px;
    }
    .nav-tabs button {
      background-color: #ff9933; 
      color: white;
      border: none;
      padding: 12px 25px;
      margin: 5px 10px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 6px 0px #cc7a29, 0 10px 15px rgba(0,0,0,0.4); 
      transition: all 0.2s ease;
    }
    .nav-tabs button:hover {
      background-color: #e68a00;
      transform: translateY(2px);
      box-shadow: 0 4px 0px #cc7a29, 0 6px 10px rgba(0,0,0,0.4);
    }
    .nav-tabs button:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0px #cc7a29, 0 2px 5px rgba(0,0,0,0.4);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
      border-left: 5px solid #138808;
    }
    .card h3 {
      margin-top: 0;
      color: #1a1a1a;
    }
    .badge {
      display: inline-block;
      background: #eef2f7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 12px;
    }
    .detail {
      font-size: 0.9rem;
      margin: 6px 0;
      line-height: 1.4;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
    
    #data-container p {
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div id="bg-image"></div>

  <div class="content-wrapper">
    <header>
      <h1>Bharat Data Project</h1>
      <p id="page-subtitle">Select a category below</p>
    </header>

    <div class="nav-tabs">
      <button onclick="loadPrimeMinisters()">Prime Ministers</button>
      <button onclick="loadPresidents()">Presidents</button>
      <button onclick="loadVicePresidents()">Vice Presidents</button>
    </div>

    <div id="data-container" class="grid">
      <p style="text-align:center; grid-column: 1 / -1;">Click a button above to load data.</p>
    </div>
  </div>

  <script>
    const container = document.getElementById('data-container');
    const subtitle = document.getElementById('page-subtitle');
    const bgImage = document.getElementById('bg-image');

    function dimBackground() {
      bgImage.classList.add('dimmed');
    }

    function loadPrimeMinisters() {
      dimBackground();
      container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">Loading Prime Ministers...</p>';
      subtitle.innerText = "Prime Ministers of India (1947 – Present)";
      
      fetch('prime_ministers.json')
        .then(response => response.json())
        .then(data => {
          container.innerHTML = '';
          data.forEach(pm => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3>#${pm.id} ${pm.name}</h3>
              <div class="badge">${pm.party}</div>
              <div class="detail"><span class="label">Term:</span> ${pm.term_start} &ndash; ${pm.term_end}</div>
              <div class="detail"><span class="label">Seats Won:</span> ${pm.seats_won}</div>
              <div class="detail"><span class="label">Total Lok Sabha Seats:</span> ${pm.total_seats}</div>
              <div class="detail"><span class="label">Vote Share:</span> ${pm.vote_share}</div>
            `;
            container.appendChild(card);
          });
        })
        .catch(error => {
          container.innerHTML = '<p>Error loading data.</p>';
        });
    }

    function loadPresidents() {
      dimBackground();
      container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">Loading Presidents...</p>';
      subtitle.innerText = "Presidents of India (1950 – Present)";
      
      fetch('presidents.json')
        .then(response => response.json())
        .then(data => {
          container.innerHTML = '';
          data.forEach(president => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3>#${president.id} ${president.name}</h3>
              <div class="detail"><span class="label">Term:</span> ${president.term_start} &ndash; ${president.term_end}</div>
              <div class="detail"><span class="label">Notable Fact:</span> ${president.notable_fact}</div>
            `;
            container.appendChild(card);
          });
        })
        .catch(error => {
          container.innerHTML = '<p>Error loading data.</p>';
        });
    }

    function loadVicePresidents() {
      dimBackground();
      container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">Loading Vice Presidents...</p>';
      subtitle.innerText = "Vice Presidents of India (1952 – Present)";
      
      fetch('vice_presidents.json')
        .then(response => response.json())
        .then(data => {
          container.innerHTML = '';
          data.forEach(vp => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3>#${vp.id} ${vp.name}</h3>
              <div class="detail"><span class="label">Term:</span> ${vp.term_start} &ndash; ${vp.term_end}</div>
              <div class="detail"><span class="label">Notable Fact:</span> ${vp.notable_fact}</div>
            `;
            container.appendChild(card);
          });
        })
        .catch(error => {
          container.innerHTML = '<p>Error loading data.</p>';
        });
    }
  </script>

</body>
</html>
