<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Data Project</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #000;
    }

    #bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
      opacity: 0.99; 
      transition: opacity 0.8s ease-in-out;
      z-index: 0; 
    }

    #bg-image.dimmed {
      opacity: 0.25; 
    }

    .content-wrapper {
      position: relative;
      padding: 20px;
      z-index: 10; 
    }

    header {
      text-align: center;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.25);
      color: black;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    
    h1 { margin: 0 0 10px 0; }
    
    .category-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .main-btn {
      background-color: #138808; 
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 6px 0px #0e6306, 0 10px 15px rgba(0,0,0,0.4); 
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }
    .main-btn:hover {
      background-color: #18a30b;
      transform: translateY(2px);
      box-shadow: 0 4px 0px #0e6306, 0 6px 10px rgba(0,0,0,0.4);
    }
    .main-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0px #0e6306, 0 2px 5px rgba(0,0,0,0.4);
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .hidden {
      display: none !important;
    }
    
    .nav-tabs button {
      background-color: #ff9933; 
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 6px 0px #cc7a29, 0 10px 15px rgba(0,0,0,0.4); 
      transition: all 0.2s ease;
    }
    .nav-tabs button:hover {
      background-color: #e68a00;
      transform: translateY(2px);
      box-shadow: 0 4px 0px #cc7a29, 0 6px 10px rgba(0,0,0,0.4);
    }
    .nav-tabs button:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0px #cc7a29, 0 2px 5px rgba(0,0,0,0.4);
    }

    /* Simplified, Clean Loading Spinner */
    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 153, 51, 0.2);
      border-top: 5px solid #ff9933;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto;
      grid-column: 1 / -1; /* Centers it perfectly in the grid */
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
      border-left: 5px solid #138808;
    }
    .card h3 {
      margin-top: 0;
      color: #1a1a1a;
    }
    .badge {
      display: inline-block;
      background: #eef2f7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 12px;
    }
    .detail {
      font-size: 0.9rem;
      margin: 6px 0;
      line-height: 1.4;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
    
    #data-container p {
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <img id="bg-image" src="finalflag.png" alt="Indian Flag Background">

  <div class="content-wrapper">
    <header>
      <h1>Bharat Data Project</h1>
      <p id="page-subtitle">Select a category below</p>
    </header>

    <div class="category-section">
      <button class="main-btn" onclick="toggleMenu('political-menu')">Indian Political History ▼</button>
      
      <div id="political-menu" class="nav-tabs hidden">
        <button onclick="loadPrimeMinisters()">Prime Ministers</button>
        <button onclick="loadDeputyPrimeMinisters()">Deputy PMs</button>
        <button onclick="loadPresidents()">Presidents</button>
        <button onclick="loadVicePresidents()">Vice Presidents</button>
      </div>
    </div>

    <div id="data-container" class="grid">
      <p style="text-align:center; grid-column: 1 / -1;">Click a category above to load data.</p>
    </div>
  </div>

 <script>
    const container = document.getElementById('data-container');
    const subtitle = document.getElementById('page-subtitle');
    const bgImage = document.getElementById('bg-image');

    let activeCategory = ""; // Remembers what is currently on the screen

    // Toggles the main dropdown menu
    function toggleMenu(menuId) {
      const menu = document.getElementById(menuId);
      menu.classList.toggle('hidden');
      
      // Clear the screen if the menu is closed
      if (menu.classList.contains('hidden')) {
        clearScreen();
      }
    }

    function dimBackground() {
      bgImage.classList.add('dimmed');
    }

    // A reusable function to clear the screen
    function clearScreen() {
      container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">Click a category above to load data.</p>';
      subtitle.innerText = "Select a category below";
      bgImage.classList.remove('dimmed');
      activeCategory = "";
    }

    // THE MASTER FUNCTION FOR ALL CURRENT AND FUTURE BUTTONS
    function loadCategoryData(categoryName, title, jsonFile, formatItem) {
      // 1. If clicking the same button twice, turn it off!
      if (activeCategory === categoryName) {
        clearScreen();
        return;
      }

      // 2. Otherwise, load the new data with the animation
      activeCategory = categoryName;
      dimBackground();
      subtitle.innerText = title;
      container.innerHTML = '<div class="loader"></div>';

      setTimeout(() => {
        fetch(jsonFile)
          .then(response => response.json())
          .then(data => {
            container.innerHTML = '';
            data.forEach(item => {
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = formatItem(item);
              container.appendChild(card);
            });
          })
          .catch(error => {
            container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">Error loading data.</p>';
          });
      }, 1200);
    }

    // --- YOUR BUTTON FUNCTIONS ARE NOW INCREDIBLY SHORT! ---

    function loadPrimeMinisters() {
      loadCategoryData('PM', "Prime Ministers of India (1947 – Present)", 'prime_ministers.json', (pm) => `
          <h3>#${pm.id} ${pm.name}</h3>
          <div class="badge">${pm.party}</div>
          <div class="detail"><span class="label">Term:</span> ${pm.term_start} &ndash; ${pm.term_end}</div>
          <div class="detail"><span class="label">Seats Won:</span> ${pm.seats_won}</div>
          <div class="detail"><span class="label">Total Lok Sabha Seats:</span> ${pm.total_seats}</div>
          <div class="detail"><span class="label">Vote Share:</span> ${pm.vote_share}</div>
      `);
    }

    function loadPresidents() {
      loadCategoryData('Pres', "Presidents of India (1950 – Present)", 'presidents.json', (p) => `
          <h3>#${p.id} ${p.name}</h3>
          <div class="detail"><span class="label">Term:</span> ${p.term_start} &ndash; ${p.term_end}</div>
          <div class="detail"><span class="label">Notable Fact:</span> ${p.notable_fact}</div>
      `);
    }

    function loadVicePresidents() {
      loadCategoryData('VP', "Vice Presidents of India (1952 – Present)", 'vice_presidents.json', (vp) => `
          <h3>#${vp.id} ${vp.name}</h3>
          <div class="detail"><span class="label">Term:</span> ${vp.term_start} &ndash; ${vp.term_end}</div>
          <div class="detail"><span class="label">Notable Fact:</span> ${vp.notable_fact}</div>
      `);
    }

    function loadDeputyPrimeMinisters() {
      loadCategoryData('DPM', "Deputy Prime Ministers of India", 'deputy_prime_ministers.json', (dpm) => `
          <h3>#${dpm.id} ${dpm.name}</h3>
          <div class="badge">${dpm.party}</div>
          <div class="detail"><span class="label">Term:</span> ${dpm.term_start} &ndash; ${dpm.term_end}</div>
          <div class="detail"><span class="label">Notable Fact:</span> ${dpm.notable_fact}</div>
      `);
    }
  </script>
</body>
</html>
