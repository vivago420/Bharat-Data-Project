<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Data Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    header {
      text-align: center;
      padding: 20px;
      background: #0f2b48;
      color: white;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 10px 0; }
    
    /* Navigation Buttons */
    .nav-tabs {
      text-align: center;
      margin-bottom: 30px;
    }
    .nav-tabs button {
      background-color: #ff9933; /* Saffron color */
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .nav-tabs button:hover {
      background-color: #e68a00;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      border-left: 5px solid #138808; /* Green for cards */
    }
    .card h3 {
      margin-top: 0;
      color: #1a1a1a;
    }
    .badge {
      display: inline-block;
      background: #eef2f7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 12px;
    }
    .detail {
      font-size: 0.9rem;
      margin: 6px 0;
      line-height: 1.4;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bharat Data Project</h1>
    <p id="page-subtitle">Select a category below</p>
  </header>

  <div class="nav-tabs">
    <button onclick="loadPrimeMinisters()">Prime Ministers</button>
    <button onclick="loadPresidents()">Presidents</button>
  </div>

  <div id="data-container" class="grid">
    <p style="text-align:center; grid-column: 1 / -1;">Click a button above to load data.</p>
  </div>

  <script>
    const container = document.getElementById('data-container');
    const subtitle = document.getElementById('page-subtitle');

    function loadPrimeMinisters() {
      container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">Loading Prime Ministers...</p>';
      subtitle.innerText = "Prime Ministers of India (1947 – Present)";
      
      fetch('prime_ministers.json')
        .then(response => response.json())
        .then(data => {
          container.innerHTML = '';
          data.forEach(pm => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3>#${pm.id} ${pm.name}</h3>
              <div class="badge">${pm.party}</div>
              <div class="detail"><span class="label">Term:</span> ${pm.term_start} &ndash; ${pm.term_end}</div>
              <div class="detail"><span class="label">Seats Won:</span> ${pm.seats_won}</div>
              <div class="detail"><span class="label">Total Lok Sabha Seats:</span> ${pm.total_seats}</div>
              <div class="detail"><span class="label">Vote Share:</span> ${pm.vote_share}</div>
            `;
            container.appendChild(card);
          });
        })
        .catch(error => {
          container.innerHTML = '<p>Error loading data.</p>';
        });
    }

    function loadPresidents() {
      container.innerHTML = '<p style="text-align:center; grid-column: 1 / -1;">Loading Presidents...</p>';
      subtitle.innerText = "Presidents of India (1950 – Present)";
      
      fetch('presidents.json')
        .then(response => response.json())
        .then(data => {
          container.innerHTML = '';
          data.forEach(president => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3>#${president.id} ${president.name}</h3>
              <div class="detail"><span class="label">Term:</span> ${president.term_start} &ndash; ${president.term_end}</div>
              <div class="detail"><span class="label">Notable Fact:</span> ${president.notable_fact}</div>
            `;
            container.appendChild(card);
          });
        })
        .catch(error => {
          container.innerHTML = '<p>Error loading data.</p>';
        });
    }
  </script>

</body>
</html>
